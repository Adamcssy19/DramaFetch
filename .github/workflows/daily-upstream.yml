name: 每日检查上游更新

# 上游有新提交时，自动提升修订号、记录上游提交、触发一次构建并发布。
# 这样仓库里完全不需要保存上游源码，也能持续跟上游走。
on:
  schedule:
    # 每天北京时间 04:00 左右执行
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 查询上游最新提交
        id: upstream
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/x315600/guoapp.git refs/heads/main | cut -f1)
          if [ -z "$sha" ]; then
            echo "无法获取上游提交，稍后重试" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "上游最新提交：$sha"

      - name: 与上次记录对比
        id: diff
        run: |
          set -euo pipefail
          last=$(tr -d '[:space:]' < upstream.lock 2>/dev/null || echo '')
          echo "上次记录：${last:-无}"
          if [ "${{ steps.upstream.outputs.sha }}" = "$last" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交，跳过"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提升版本号并触发构建
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py
          echo "$SHA" > upstream.lock
          git config user.name "auto-update"
          git config user.email "auto-update@users.noreply.github.com"
          git add version.txt upstream.lock
          git commit -m "上游更新至 ${SHA:0:7}，版本提升到 $(cat version.txt)"
          git push origin HEAD:main
          gh workflow run build-windows.yml --ref main
          echo "已触发构建流程"
