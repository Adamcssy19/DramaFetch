name: Build Windows

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 Release 并上传安装包'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('app/config/constants.py').read()); print(VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: Create tag and release
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES=$(awk -v ver="$VERSION" '
              $0 ~ "^#+ +"ver"($| )" {flag=1; next}
              /^#+ / && flag {exit}
              flag {print}
            ' CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="DramaFetch v$VERSION"
            fi
            gh release create "$TAG" --title "DramaFetch $VERSION" --notes "$NOTES" --latest
          fi

  build-windows:
    needs: [prepare]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Build with Nuitka
        shell: pwsh
        run: |
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> $env:GITHUB_ENV
          (Get-Content scripts/Ghost-Downloader-3.iss) -replace 'APPLICATION_VERSION', '${{ needs.prepare.outputs.version }}' | Set-Content scripts/Ghost-Downloader-3.iss
          uv run scripts/deploy.py

      - name: Build updater
        shell: pwsh
        run: |
          cmake -B build-updater -G "Visual Studio 17 2022" -A x64 tools/updater
          cmake --build build-updater --config Release
          Copy-Item build-updater/Release/updater.exe dist/DramaFetch.dist/

      - name: Download Inno Setup Translation Files
        if: ${{ github.event.inputs.create_release == 'true' }}
        shell: pwsh
        run: |
          $langs = @("ChineseSimplified", "ChineseTraditional")
          foreach ($lang in $langs) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/${lang}.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\${lang}.isl"
          }

      - name: Build Installer
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.8
        with:
          path: scripts/Ghost-Downloader-3.iss

      - name: Package portable zip
        if: ${{ github.event.inputs.create_release == 'true' }}
        shell: pwsh
        run: |
          Push-Location dist/DramaFetch.dist
          7z a -tzip -mx=9 "$env:GITHUB_WORKSPACE/DramaFetch-v${{ env.VERSION }}-Windows-x64.zip" *
          Pop-Location

      - name: Upload to release
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "v${{ env.VERSION }}" "dist/DramaFetch-v${{ env.VERSION }}-x64-Setup.exe" "DramaFetch-v${{ env.VERSION }}-Windows-x64.zip" --clobber

      - name: Upload artifact (no release)
        if: ${{ github.event.inputs.create_release == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: DramaFetch-v${{ needs.prepare.outputs.version }}-Windows-x64
          path: dist/DramaFetch.dist
