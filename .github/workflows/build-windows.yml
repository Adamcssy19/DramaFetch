name: Build Windows

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 Release 并上传安装包'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('app/config/constants.py').read()); print(VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: Create tag
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只打 tag，不建 Release：等安装包上传完成时再创建，
          # 避免出现“有 Release 无资产”的空窗期（客户端会检测到更新但下载失败）
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

  build-windows:
    needs: [prepare]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv python install 3.13
          uv sync --frozen

      - name: Smoke test (imports + startup)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 特性包页面是延迟导入的，py_compile 与 Nuitka 都不会执行导入。
          # 先验证所有特性包能真实导入，再离屏真实跑一遍启动直到主窗口显示，
          # 避免产出「装完打不开」的安装包。
          uv run python scripts/check_imports.py
          uv run python scripts/check_startup.py

      - name: Build with Nuitka
        shell: pwsh
        run: |
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> $env:GITHUB_ENV
          (Get-Content scripts/DramaFetch.iss) -replace 'APPLICATION_VERSION', '${{ needs.prepare.outputs.version }}' | Set-Content scripts/DramaFetch.iss
          uv run scripts/deploy.py

      - name: Build updater
        shell: pwsh
        run: |
          cmake -B build-updater -G "Visual Studio 17 2022" -A x64 tools/updater
          cmake --build build-updater --config Release
          Copy-Item build-updater/Release/updater.exe dist/DramaFetch.dist/

      - name: Download Inno Setup Translation Files
        if: ${{ github.event.inputs.create_release == 'true' }}
        shell: pwsh
        run: |
          $langs = @("ChineseSimplified")
          foreach ($lang in $langs) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/${lang}.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\${lang}.isl"
          }

      - name: Build Installer
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.8
        with:
          path: scripts/DramaFetch.iss

      - name: Package portable zip
        if: ${{ github.event.inputs.create_release == 'true' }}
        shell: pwsh
        run: |
          Push-Location dist/DramaFetch.dist
          7z a -tzip -mx=9 "$env:GITHUB_WORKSPACE/DramaFetch-v${{ env.VERSION }}-Windows-x64.zip" *
          Pop-Location

      - name: Upload to release
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 资产就绪后才创建 Release（含 --latest）：此时客户端检测到更新即可下载
          $tag = "v${{ env.VERSION }}"
          $files = @("dist/DramaFetch-v${{ env.VERSION }}-x64-Setup.exe", "DramaFetch-v${{ env.VERSION }}-Windows-x64.zip")
          # 提取当前版本的更新日志：从 "## 版本号" 到下一个 "## " 为止
          $changelog = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $changelog.Count; $i++) {
            if ($changelog[$i] -match "^## $($env:VERSION)\b") { $start = $i + 1; break }
          }
          $noteLines = New-Object System.Collections.Generic.List[string]
          if ($start -ge 0) {
            for ($i = $start; $i -lt $changelog.Count; $i++) {
              if ($changelog[$i] -match "^##\s") { break }
              $noteLines.Add($changelog[$i])
            }
          }
          $notes = ($noteLines -join "`n").Trim()
          if (gh release view $tag) {
            gh release upload $tag $files --clobber
          } else {
            if (-not $notes) { $notes = "DramaFetch v${{ env.VERSION }}" }
            gh release create $tag $files --title "DramaFetch ${{ env.VERSION }}" --notes "$notes" --latest
          }

      - name: Upload artifact (no release)
        if: ${{ github.event.inputs.create_release == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: DramaFetch-v${{ needs.prepare.outputs.version }}-Windows-x64
          path: dist/DramaFetch.dist
