name: 构建 Windows 安装包

# 只出一个包：全部站源的 Windows 安装程序。
# 上游源码更新由「同步上游」流程合并进来后，会自动触发本流程。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # 让 Python 用 UTF-8 输出，否则脚本里的中文在 Windows 上会报编码错误
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # 上游源码不入库，先拉下来，后面的环境准备与构建都依赖它
      - name: 拉取上游源码
        run: python scripts/fetch_upstream.py

      - name: 准备 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/guoapp/native/go.mod
          cache-dependency-path: upstream/guoapp/native/go.sum

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # 编译工具安装一次要一两分钟，缓存下来；命中就直接跳过安装
      # 只缓存 MinGW（在 ProgramData 下，写入不受限）；Inno Setup 装在 Program Files，恢复缓存容易出问题，每次现装
      - name: 还原编译工具缓存
        id: toolcache
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\mingw64
          key: windows-tools-mingw-v2

      - name: 安装编译与打包工具
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $exe = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' `
                   -Recurse -Include 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            choco install mingw --no-progress -y
            $exe = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' `
                     -Recurse -Include 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          } else {
            Write-Host '编译工具已从缓存恢复'
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not $exe) { $exe = (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw '编译工具链安装失败，找不到 gcc' }
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe --version | Select-Object -First 1

      - name: 应用定制
        run: python scripts/apply_custom.py

      # 先单独跑一次静态检查，把本项目新增文件的问题在编译前拦下来
      - name: 检查本项目新增文件
        shell: pwsh
        working-directory: upstream/guoapp
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/app_build.dart lib/app_theme.dart lib/download_methods.dart lib/resource_settings.dart lib/update_screen.dart lib/dramafetch_home.dart lib/dramafetch_nav.dart lib/dramafetch_update.dart lib/dramafetch_settings.dart lib/dramafetch_topbar.dart lib/design/df_tokens.dart lib/design/df_surface.dart lib/design/df_controls.dart lib/design/df_poster.dart lib/design/df_design.dart

      - name: 构建应用
        run: python scripts/build_app.py

      - name: 生成安装包
        run: python scripts/build_installer.py

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成校验文件
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < version.txt)
          echo "version=$version" >> "$GITHUB_ENV"
          mkdir -p release
          find artifacts -type f -name '*.exe' -exec cp {} release/ \;
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 标签只带版本号，不带构建号，例如 v0.0.1
          tag="v${version%%+*}"
          base="${version%%+*}"
          {
            printf '# DramaFetch %s（Windows 64 位安装版）\n\n' "$version"
            # 更新内容取自 CHANGELOG.md 里与版本号对应的一节
            if [ -f CHANGELOG.md ]; then
              section=$(awk -v v="$base" '
                $0 ~ "^##[[:space:]]+v?" v "([[:space:]]|$)" {found=1; next}
                found && /^##[[:space:]]/ {exit}
                found {print}
              ' CHANGELOG.md)
              if [ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
                printf '## 更新内容\n\n%s\n\n' "$section"
              fi
            fi
            printf '## 安装\n\n下载下面的安装程序，双击安装即可'
            printf '（会自动创建开始菜单与桌面快捷方式）。\n\n'
            printf '已经装过旧版本的话，程序内「检查更新」可以直接升级。\n'
            printf '系统要求：Windows 10 / 11 64 位。\n\n'
            printf '%s\n\n' '---'
            printf '上游提交：`%s`　校验文件：SHA256SUMS.txt\n' "$(cat upstream.lock 2>/dev/null || echo '未记录')"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "DramaFetch ${version}" --notes-file notes.md
            for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ ! -e "release/$name" ]; then
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
          else
            gh release create "$tag" release/* --title "DramaFetch ${version}" --notes-file notes.md
          fi
