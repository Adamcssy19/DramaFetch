name: Sync Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步更新日志的 tag（如 v0.0.3）'
        required: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract notes
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          VERSION="${VERSION#v}"
          # 提取 "## 版本号" 到下一个 "## " 之间的更新日志
          awk -v header="## ${VERSION}" '
            index($0, header) == 1 { found = 1; next }
            found && substr($0, 1, 3) == "## " { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md
          test -s release_notes.md || { echo "未提取到更新日志"; exit 1; }

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: gh release edit "$TAG" --notes-file release_notes.md
